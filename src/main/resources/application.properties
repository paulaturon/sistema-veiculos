spring.application.name=sistema-veiculos

# Porta onde o sistema vai rodar -> http://localhost:8080
server.port=8080

# ===== CONEXAO COM O MYSQL =====
# Banco: sistema_veiculos (criado pelo script database/sistema_veiculos.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_veiculos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
# >>> TROQUE PELA SENHA QUE VOCE DEFINIU NA INSTALACAO DO MYSQL <<<
spring.datasource.password=SUA_SENHA_AQUI

# ===== JPA / HIBERNATE =====
# update = cria/ajusta as tabelas automaticamente se precisar
spring.jpa.hibernate.ddl-auto=update
# mostra no console os comandos SQL executados (bom para o video)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
